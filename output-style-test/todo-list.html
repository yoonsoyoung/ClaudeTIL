<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>할 일 목록</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen py-8 px-4">
    <div class="max-w-2xl mx-auto">
        <!-- 헤더 -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">📝 할 일 목록</h1>
            <p class="text-gray-600">오늘의 할 일을 관리해보세요</p>
        </div>

        <!-- 입력 카드 -->
        <div class="bg-white rounded-lg shadow-lg p-6 mb-6">
            <div class="flex gap-2">
                <input
                    id="todoInput"
                    type="text"
                    placeholder="새로운 할 일을 입력하세요..."
                    autocomplete="off"
                    class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
                >
                <button
                    id="addBtn"
                    class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-lg transition-colors duration-200"
                >
                    추가
                </button>
            </div>
        </div>

        <!-- 할 일 목록 카드 -->
        <div class="bg-white rounded-lg shadow-lg overflow-hidden">
            <ul id="todoList" class="divide-y divide-gray-200"></ul>

            <!-- 빈 상태 메시지 -->
            <div id="emptyMessage" class="p-8 text-center text-gray-500">
                <p class="text-lg">✨ 아직 할 일이 없습니다</p>
                <p class="text-sm mt-2">위에서 새로운 할 일을 추가해보세요!</p>
            </div>
        </div>

        <!-- 통계 -->
        <div class="mt-6 grid grid-cols-3 gap-4">
            <div class="bg-white rounded-lg shadow p-4 text-center">
                <div class="text-2xl font-bold text-indigo-600" id="totalCount">0</div>
                <div class="text-sm text-gray-600">전체</div>
            </div>
            <div class="bg-white rounded-lg shadow p-4 text-center">
                <div class="text-2xl font-bold text-green-600" id="completedCount">0</div>
                <div class="text-sm text-gray-600">완료</div>
            </div>
            <div class="bg-white rounded-lg shadow p-4 text-center">
                <div class="text-2xl font-bold text-orange-600" id="remainingCount">0</div>
                <div class="text-sm text-gray-600">남은 할 일</div>
            </div>
        </div>
    </div>

    <script>
        // DOM 요소 참조
        const todoInput = document.getElementById('todoInput');
        const addBtn = document.getElementById('addBtn');
        const todoList = document.getElementById('todoList');
        const emptyMessage = document.getElementById('emptyMessage');

        // localStorage에서 할 일 불러오기
        let todos = JSON.parse(localStorage.getItem('todos')) || [];

        // 화면 업데이트 함수
        function renderTodos() {
            todoList.innerHTML = '';

            if (todos.length === 0) {
                emptyMessage.style.display = 'block';
            } else {
                emptyMessage.style.display = 'none';

                // 할 일 항목 렌더링
                todos.forEach((todo, index) => {
                    const li = document.createElement('li');
                    li.className = 'flex items-center gap-3 p-4 hover:bg-gray-50 transition-colors duration-200';

                    li.innerHTML = `
                        <input
                            type="checkbox"
                            ${todo.completed ? 'checked' : ''}
                            onchange="toggleTodo(${index})"
                            class="w-5 h-5 text-indigo-600 rounded focus:ring-2 focus:ring-indigo-500 cursor-pointer"
                        >
                        <span class="flex-1 text-lg ${todo.completed ? 'line-through text-gray-400' : 'text-gray-800'}">
                            ${escapeHtml(todo.text)}
                        </span>
                        <button
                            onclick="deleteTodo(${index})"
                            class="text-red-500 hover:text-red-700 hover:bg-red-50 px-3 py-2 rounded transition-colors duration-200"
                        >
                            🗑️
                        </button>
                    `;

                    todoList.appendChild(li);
                });
            }

            // 통계 업데이트
            updateStats();
        }

        // 할 일 추가
        function addTodo() {
            const text = todoInput.value.trim();
            if (text === '') {
                alert('할 일을 입력하세요');
                return;
            }

            todos.push({ text, completed: false });
            todoInput.value = '';
            saveTodos();
            renderTodos();
            todoInput.focus();
        }

        // 할 일 완료 토글
        function toggleTodo(index) {
            todos[index].completed = !todos[index].completed;
            saveTodos();
            renderTodos();
        }

        // 할 일 삭제
        function deleteTodo(index) {
            if (confirm('정말 삭제하시겠습니까?')) {
                todos.splice(index, 1);
                saveTodos();
                renderTodos();
            }
        }

        // 통계 업데이트
        function updateStats() {
            const total = todos.length;
            const completed = todos.filter(todo => todo.completed).length;
            const remaining = total - completed;

            document.getElementById('totalCount').textContent = total;
            document.getElementById('completedCount').textContent = completed;
            document.getElementById('remainingCount').textContent = remaining;
        }

        // localStorage에 저장
        function saveTodos() {
            localStorage.setItem('todos', JSON.stringify(todos));
        }

        // XSS 방지
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 이벤트 리스너
        addBtn.addEventListener('click', addTodo);
        todoInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTodo();
        });

        // 초기 렌더링
        renderTodos();
    </script>
</body>
</html>
