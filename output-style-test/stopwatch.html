<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>스톱워치</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center"
  >
    <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-sm">
      <!-- 제목 -->
      <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">스톱워치</h1>

      <!-- 시간 표시 -->
      <div class="bg-gradient-to-r from-blue-500 to-indigo-600 rounded-xl p-8 mb-8">
        <div id="timeDisplay" class="text-6xl font-mono font-bold text-white text-center">
          00:00:00
        </div>
      </div>

      <!-- 버튼 그룹 -->
      <div class="flex gap-4 mb-6">
        <!-- 시작/일시정지 버튼 -->
        <button
          id="toggleBtn"
          class="flex-1 bg-blue-500 hover:bg-blue-600 active:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 ease-in-out transform hover:scale-105"
        >
          시작
        </button>

        <!-- 리셋 버튼 -->
        <button
          id="resetBtn"
          class="flex-1 bg-red-500 hover:bg-red-600 active:bg-red-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 ease-in-out transform hover:scale-105"
        >
          리셋
        </button>
      </div>

      <!-- 설명 텍스트 -->
      <p class="text-center text-gray-600 text-sm">시작 버튼을 눌러 스톱워치를 시작하세요</p>
    </div>

    <script>
      // 스톱워치 상태 관리
      let elapsed = 0; // 경과 시간 (밀리초)
      let isRunning = false; // 실행 중 여부
      let startTime = 0; // 시작 시간
      let pausedTime = 0; // 일시정지된 시간
      let animationFrameId = null;

      const timeDisplay = document.getElementById('timeDisplay');
      const toggleBtn = document.getElementById('toggleBtn');
      const resetBtn = document.getElementById('resetBtn');

      /**
       * 경과 시간을 "HH:MM:SS" 형식으로 변환
       * @param {number} ms - 밀리초 단위의 경과 시간
       * @returns {string} "HH:MM:SS" 형식의 시간 문자열
       */
      function formatTime(ms) {
        const totalSeconds = Math.floor(ms / 1000);
        const hours = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
        const minutes = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
        const seconds = String(totalSeconds % 60).padStart(2, '0');
        return `${hours}:${minutes}:${seconds}`;
      }

      /**
       * 시간 표시를 업데이트하고 애니메이션 프레임 다음 호출 예약
       * requestAnimationFrame을 사용하여 부드러운 업데이트 실현
       */
      function update() {
        if (isRunning) {
          // 현재 시간을 기반으로 경과 시간 계산
          elapsed = pausedTime + (Date.now() - startTime);
          timeDisplay.textContent = formatTime(elapsed);

          // 다음 프레임에서 재귀적으로 호출
          animationFrameId = requestAnimationFrame(update);
        }
      }

      /**
       * 시작/일시정지 버튼 클릭 핸들러
       * 상태를 토글하고 UI를 업데이트
       */
      function toggleStopwatch() {
        if (isRunning) {
          // 일시정지 로직
          isRunning = false;
          cancelAnimationFrame(animationFrameId);
          toggleBtn.textContent = '시작';
          pausedTime = elapsed;
          toggleBtn.classList.remove('bg-red-500', 'hover:bg-red-600', 'active:bg-red-700');
          toggleBtn.classList.add('bg-blue-500', 'hover:bg-blue-600', 'active:bg-blue-700');
        } else {
          // 시작 로직
          isRunning = true;
          startTime = Date.now();
          toggleBtn.textContent = '일시정지';
          toggleBtn.classList.remove('bg-blue-500', 'hover:bg-blue-600', 'active:bg-blue-700');
          toggleBtn.classList.add('bg-red-500', 'hover:bg-red-600', 'active:bg-red-700');
          update();
        }
      }

      /**
       * 리셋 버튼 클릭 핸들러
       * 모든 상태를 초기값으로 되돌림
       */
      function resetStopwatch() {
        isRunning = false;
        elapsed = 0;
        pausedTime = 0;
        cancelAnimationFrame(animationFrameId);

        // UI 초기화
        timeDisplay.textContent = formatTime(0);
        toggleBtn.textContent = '시작';
        toggleBtn.classList.remove('bg-red-500', 'hover:bg-red-600', 'active:bg-red-700');
        toggleBtn.classList.add('bg-blue-500', 'hover:bg-blue-600', 'active:bg-blue-700');
      }

      // 이벤트 리스너 등록
      toggleBtn.addEventListener('click', toggleStopwatch);
      resetBtn.addEventListener('click', resetStopwatch);
    </script>
  </body>
</html>
